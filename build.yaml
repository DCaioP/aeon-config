# DIAGNOSTICO: esquerda da Le com log do kscan na serial USB.
# Sem BLE e sem split: so a matriz, para mapear (linha, coluna) eletrica
# de cada tecla fisica. Mesmo overlay row2col da producao.
include:
  - board: nice_nano_v2
    shield: sofle_left
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_ZMK_LOG_LEVEL_DBG=y
      -DCONFIG_ZMK_SPLIT=n
      -DCONFIG_ZMK_BLE=n
      -DCONFIG_LOG_BUFFER_SIZE=32768
      -DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/config/aeon_row2col_left.overlay
    artifact-name: diag-kscan-sofle_left-le
